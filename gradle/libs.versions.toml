[versions]
agp = "9.1.0"
kotlin = "2.4.0"
# The stdlib the library depends on: matches its Kotlin apiVersion (2.2).
kotlinStdlib = "2.2.21"
coroutines = "1.10.2"
installreferrer = "2.2"
junit = "4.13.2"
json = "20240303"
mockwebserver = "4.12.0"
robolectric = "4.16"
activity = "1.13.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlib" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
installreferrer = { module = "com.android.installreferrer:installreferrer", version.ref = "installreferrer" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
