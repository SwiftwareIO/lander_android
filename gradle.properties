org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The library declares an older kotlin-stdlib itself (see lander/build.gradle.kts),
# so apps on older Kotlin versions can use it.
kotlin.stdlib.default.dependency=false

# Maven coordinates of the SDK, link.lander:lander-android. VERSION_NAME is also
# Lander.VERSION (through BuildConfig); a release tag android-vX.Y.Z must match it.
GROUP=link.lander
POM_ARTIFACT_ID=lander-android
VERSION_NAME=0.1.0
